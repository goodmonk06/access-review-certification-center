version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: access-review-db
    environment:
      POSTGRES_USER: accessreview
      POSTGRES_PASSWORD: accessreview
      POSTGRES_DB: accessreview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessreview"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: access-review-backend
    environment:
      DATABASE_URL: postgresql://accessreview:accessreview@postgres:5432/accessreview?schema=public
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: access-review-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
